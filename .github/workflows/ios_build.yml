name: Build and Deploy iOS App

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync iOS
        run: npx cap sync ios

      # TEST BUILD: Checks if the iOS app compiles successfully without needing Apple Developer accounts or sign-in keys.
      - name: Build Xcode Project (Simulator - Verification Only)
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App -skipPackagePluginValidation -skipMacroValidation
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -destination "platform=iOS Simulator,name=iPhone 15" \
                     -skipPackagePluginValidation \
                     -skipMacroValidation \
                     build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     ONLY_ACTIVE_ARCH=YES \
                     ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
                     ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS=NO

