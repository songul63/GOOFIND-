    <style>
        html, body {
            scrollbar-gutter: stable !important;
        }

        html {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            font-size: 125%;
            font-feature-settings: 'kern' 1, 'liga' 1, 'calt' 1;
            font-optical-sizing: auto;
            text-rendering: optimizeLegibility;
            -webkit-text-size-adjust: 100%;
        }

        .lucide {
            transform: scale(1.12);
            transform-origin: center;
        }

        .ann-inline-filter .lucide,
        .ann-inline-filter-btn .lucide {
            transform: none !important;
        }

        .ann-inline-filter-btn {
            width: 24px !important;
            height: 24px !important;
            min-width: 24px;
            min-height: 24px;
            flex-shrink: 0;
        }

        .ann-inline-filter-btn svg {
            width: 17px !important;
            height: 17px !important;
        }

        .emoji-3d-glyph {
            display: inline-block;
            transform: scale(1.12);
            transform-origin: center;
        }

        .announcements-zone {
            position: relative;
            background: linear-gradient(135deg, #FFF3EB 0%, #FFFAF6 58%, #FFF3EB 100%);
            border: 1px solid rgba(255, 69, 0, 0.2);
            box-shadow: 0 2px 10px rgba(255, 69, 0, 0.07);
        }
        .communities-zone {
            position: relative;
            background: linear-gradient(135deg, #EFF6FF 0%, #FFFFFF 52%, #FFF3EB 100%);
            border: 1px solid rgba(37, 99, 235, 0.18);
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.06);
        }
        .announcements-tabs {
            background: rgba(239, 246, 255, 0.55);
            border: 1px solid rgba(37, 99, 235, 0.12);
        }

        body {
            font-family: inherit;
            background-color: #EFF6FF;
            color: #0A0F1A;
            font-weight: 700;
            line-height: 1.58;
            letter-spacing: -0.006em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #root,
        button,
        input,
        textarea,
        select,
        optgroup {
            font-family: inherit;
            font-weight: 700;
        }

        h1, h2, h3, h4, h5, h6,
        .font-display {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #070B12;
        }

        p, span, li, label, td, th, a, div {
            font-weight: 700;
        }

        .font-thin,
        .font-extralight,
        .font-light,
        .font-normal {
            font-weight: 600 !important;
        }

        .font-medium {
            font-weight: 700 !important;
        }

        .font-semibold {
            font-weight: 800 !important;
        }

        strong, b, .font-bold, .font-black, .font-extrabold {
            font-weight: 800 !important;
        }

        .text-primary {
            color: #1D4ED8 !important;
            font-weight: 800 !important;
        }

        .text-accent,
        .text-accent-vivid,
        .hover\:text-accent:hover,
        .hover\:text-accent-vivid:hover {
            color: #FF3200;
            font-weight: 800 !important;
        }

        .text-accent-mid {
            color: #FF4D00;
            font-weight: 800 !important;
        }
        
        @keyframes heartbeat {
          0% { transform: scale(1); }
          50% { transform: scale(1.15); }
          100% { transform: scale(1); }
        }
        
        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.3; }
        }
        
        .animate-heartbeat {
          animation: heartbeat 2s ease-in-out infinite;
        }

        .animate-blink {
          animation: blink 1s ease-in-out infinite;
        }

        ::-webkit-scrollbar {
          width: 8px;
        }
        
        ::-webkit-scrollbar-track {
          background: #F3F4F6;
        }
        
        ::-webkit-scrollbar-thumb {
          background: #93C5FD;
          border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
          background: #2563EB;
        }

        .no-scrollbar::-webkit-scrollbar {
          display: none;
        }

        .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }

        /* Home: gap between Şirketler / İlanlar / Topluluk = one category pill box (6.75rem) */
        .home-sections {
          display: flex;
          flex-direction: column;
          gap: 15rem;
        }

        @media (max-width: 640px) {
          .home-sections {
            gap: 10rem;
          }
        }

        .region-menu-btn {
          display: inline-flex !important;
          align-items: center;
          justify-content: center;
          width: 2rem;
          height: 2rem;
          min-width: 2rem;
          min-height: 2rem;
          padding: 0;
          margin-right: -0.125rem;
          background: transparent !important;
          color: #2563EB !important;
          border: none !important;
          border-radius: 0.75rem;
          flex-shrink: 0;
          box-shadow: none !important;
        }

        .region-menu-btn svg {
          color: #2563EB !important;
          stroke: #2563EB !important;
        }

        .region-menu-btn.is-open {
          background: transparent !important;
          opacity: 0.7;
        }

        .region-menu-btn:hover {
          opacity: 0.75;
        }

        .region-menu-panel {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0.25rem;
          padding: 0.25rem;
          background: #FFFFFF;
          border: 1px solid rgba(37, 99, 235, 0.2);
          border-radius: 0.75rem;
          box-shadow: 0 8px 24px rgba(15, 23, 42, 0.15);
          min-width: 7rem;
        }

        .region-menu-panel-title {
          grid-column: 1 / -1;
          margin: 0;
          padding: 0.25rem 0.35rem 0.1rem;
          font-size: 9px;
          font-weight: 800;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #64748b;
          text-align: center;
        }

        /* Standard content images get a zoom cursor to show they are clickable */
        img:not(.no-lightbox):not([src*="google.svg"]) {
          cursor: zoom-in;
          transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
        }
        img:not(.no-lightbox):not([src*="google.svg"]):hover {
          transform: scale(1.02);
          opacity: 0.95;
        }
        /* Tiny avatars/icons/logos should remain default */
        img.w-11, img.w-12, img.w-10, img.w-9, img.w-8, img.w-6, img.w-5, 
        .w-12 img, .w-10 img, .w-8 img, .w-11 img, .w-9 img, [src*="google.svg"] {
          cursor: default !important;
          transform: none !important;
          opacity: 1 !important;
        }

        /* Goofind 3D bubble wordmark */
        .goofind-bubble-wordmark {
          --bubble-letter: linear-gradient(
            165deg,
            #bae6fd 0%,
            #7dd3fc 7%,
            #38bdf8 16%,
            #3b82f6 38%,
            #2563eb 62%,
            #1d4ed8 86%,
            #1e40af 100%
          );
          --bubble-glint: linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.5) 0%,
            rgba(255, 255, 255, 0.18) 20%,
            rgba(255, 255, 255, 0) 48%
          );
          --bubble-f-letter: linear-gradient(
            165deg,
            #ffd4b8 0%,
            #ffb380 8%,
            #ff8533 22%,
            #ff4500 52%,
            #ea580c 78%,
            #c2410c 100%
          );
          position: relative;
          display: inline-flex;
          align-items: baseline;
          font-family: 'Fredoka', 'Plus Jakarta Sans', system-ui, sans-serif;
          font-weight: 600;
          letter-spacing: -0.025em;
          line-height: 1;
          isolation: isolate;
          -webkit-font-smoothing: antialiased;
        }

        .goofind-bubble-wordmark--prominent {
          font-weight: 700;
          letter-spacing: -0.03em;
        }

        .goofind-bubble-wordmark__body,
        .goofind-bubble-wordmark__glint {
          display: inline-flex;
          align-items: baseline;
          white-space: nowrap;
        }

        .goofind-bubble-wordmark__body {
          position: relative;
          z-index: 1;
          background-image: var(--bubble-letter);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
        }

        .goofind-bubble-wordmark__glint {
          position: absolute;
          left: 0;
          top: 0;
          z-index: 2;
          pointer-events: none;
          background-image: var(--bubble-glint);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
        }

        .goofind-bubble-f {
          display: inline;
        }

        .goofind-bubble-wordmark__body .goofind-bubble-f {
          background-image: var(--bubble-f-letter);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
        }

        .goofind-bubble-i-wrap {
          position: relative;
          display: inline-block;
          width: 0.34em;
          height: 0.72em;
          vertical-align: baseline;
          flex-shrink: 0;
        }

        .goofind-bubble-i-wrap--ghost {
          visibility: hidden;
          line-height: 0.72em;
          text-align: center;
        }

        .goofind-bubble-i-stem {
          position: absolute;
          left: 50%;
          bottom: 0.02em;
          transform: translateX(-50%);
          display: block;
          width: 0.15em;
          height: 0.56em;
          border-radius: 999px;
          background: var(--bubble-letter);
          overflow: hidden;
          z-index: 1;
        }

        .goofind-bubble-i-stem::after {
          content: '';
          position: absolute;
          inset: 0;
          border-radius: inherit;
          background: var(--bubble-glint);
        }

        .goofind-bubble-dot {
          position: absolute;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 0.22em;
          height: 0.22em;
          border-radius: 999px;
          background: var(--bubble-letter);
          overflow: hidden;
          z-index: 2;
        }

        .goofind-bubble-dot::after {
          content: '';
          position: absolute;
          inset: 0;
          border-radius: inherit;
          background: var(--bubble-glint);
        }
    </style>
</head>

    <style>@keyframes app-spin{to{transform:rotate(360deg)}}</style>
    <script>
      (function () {
        if (typeof globalThis.navigator === 'undefined') {
          globalThis.navigator = {
            userAgent: '',

            language: 'en',

            geolocation: null,

    <script>
      setTimeout(function () {
        var loading = document.getElementById('app-loading');
        if (!loading) return;
        var tagline = loading.querySelector('p:last-of-type');
        if (tagline) {
          tagline.textContent = 'Yükleme uzun sürüyor… Sayfayı yenileyin veya ağ bağlantınızı kontrol edin.';
          tagline.style.color = '#DC2626';
        }
      }, 12000);
