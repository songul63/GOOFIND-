<svg 
  viewBox="0 0 512 512" 
  width="512" 
  height="512" 
  fill="none" 
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Soft modern rounded corner container shadow -->
    <filter id="logo-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" floodColor="#000000" floodOpacity="0.3" />
    </filter>

    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" floodColor="#000000" floodOpacity="0.2" />
    </filter>
    
    <!-- Premium Vibrant Orange Gradient (The two "o" spheres representing goofind) -->
    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFA347" />
      <stop offset="50%" stopColor="#FF6B00" />
      <stop offset="100%" stopColor="#E85D00" />
    </linearGradient>

    <!-- Premium Vibrant Royal Blue-Slate Brand Gradient for the G -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#1D4ED8" />
      <stop offset="45%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#93C5FD" />
    </linearGradient>

    <!-- Glossy overlay for the spheres -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="white" stopOpacity="0.8" />
      <stop offset="100%" stopColor="white" stopOpacity="0" />
    </linearGradient>

    <!-- Elegant dark corporate blue slate gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0F19" />
      <stop offset="40%" stopColor="#111827" />
      <stop offset="100%" stopColor="#1F2937" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square container background - typical for modern Android / Play Store app icons -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- A subtle premium outer glowing accent ring -->
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="white" strokeOpacity="0.04" strokeWidth="8" />
  
  <!-- Center brand group: contains the G body and the orange spheres -->
  <g transform="translate(100, 100) scale(3.12)">
    <!-- 1. Bold, Geometric "G" body -->
    <path
      d="M 70,28 A 31,31 0 1,0 70,72 L 70,52"
      stroke="url(#blueGrad)"
      strokeWidth="11.5"
      strokeLinecap="round"
      strokeLinejoin="round"
      fill="none"
      filter="url(#logo-shadow)"
    />

    <!-- 2. Ball 1 (Representative of first "o") -->
    <g filter="url(#badge-shadow)">
      <circle 
        cx="57" 
        cy="52" 
        r="7.5" 
        fill="url(#peachGrad)" 
      />
      <!-- 3D Glossy Touch -->
      <circle 
         cx="54.8" 
         cy="49.8" 
         r="3" 
         fill="url(#glossHighlight)" 
       />
    </g>

    <!-- 3. Ball 2 (Representative of second "o") -->
    <g filter="url(#badge-shadow)">
      <circle 
        cx="42" 
        cy="52" 
        r="6" 
        fill="url(#peachGrad)" 
      />
      <!-- 3D Glossy Touch -->
      <circle 
        cx="40.2" 
        cy="50.2" 
        r="2.4" 
        fill="url(#glossHighlight)" 
      />
    </g>
  </g>
</svg>
